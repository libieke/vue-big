name: Deploy Vue App to GitHub Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/ # 强制使用官方源

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096" # 扩大 Node 内存限制，防止打包时内存溢出
          CI: false # 防止因为 ESLint 警告导致构建失败（Vercel/Netlify 常用技巧）
          # Umami 统计配置（在仓库 Settings -> Secrets and variables -> Actions 中配置）
          VUE_APP_UMAMI_SCRIPT_URL: ${{ secrets.VUE_APP_UMAMI_SCRIPT_URL }}
          VUE_APP_UMAMI_WEBSITE_ID: ${{ secrets.VUE_APP_UMAMI_WEBSITE_ID }}
          VUE_APP_UMAMI_API_BASE: ${{ secrets.VUE_APP_UMAMI_API_BASE }}
          VUE_APP_UMAMI_API_KEY: ${{ secrets.VUE_APP_UMAMI_API_KEY }}
          VUE_APP_UMAMI_TOKEN: ${{ secrets.VUE_APP_UMAMI_TOKEN }}
          VUE_APP_UMAMI_USERNAME: ${{ secrets.VUE_APP_UMAMI_USERNAME }}
          VUE_APP_UMAMI_PASSWORD: ${{ secrets.VUE_APP_UMAMI_PASSWORD }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
