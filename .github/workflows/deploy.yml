name: Deploy Vue App to GitHub Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Install dependencies
        run: |
          set +e
          node -v
          npm -v
          npm config get registry
          npm install --no-audit --no-fund > "$RUNNER_TEMP/npm-install.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 80 "$RUNNER_TEMP/npm-install.log"
            summary=$(tail -n 25 "$RUNNER_TEMP/npm-install.log" | tr -d '\r' | tr '\n' '~' | sed -e 's/%/%25/g' | cut -c1-3000)
            echo "::error title=npm install failed::$summary"
            {
              echo "### npm install log"
              echo '```'
              tail -n 120 "$RUNNER_TEMP/npm-install.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/ # <--- 再加一道保险

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096" # 扩大 Node 内存限制，防止打包时内存溢出
          CI: false # 防止因为 ESLint 警告导致构建失败（Vercel/Netlify 常用技巧）

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
