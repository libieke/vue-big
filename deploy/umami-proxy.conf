# Umami 统计接口反向代理（供 GitHub Pages 静态站点跨域调用）
#
# 说明：
# 1. GitHub Pages 本身没有 Nginx，本配置需部署在另一台可访问 Umami 的服务器上；
# 2. 将 <PAGES_DOMAIN> 替换为你的 Pages 域名（如 username.github.io 或自定义域名）；
# 3. 前端 .env.production 中配置：
#      VUE_APP_UMAMI_API_BASE = https://<proxy-host>/umami-api/api
# 4. 若前后端同源部署，可把 Access-Control-Allow-Origin 改为 "*" 或去掉 CORS 相关配置。

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name <proxy-host>;

    # ssl_certificate     /etc/nginx/ssl/<proxy-host>.crt;
    # ssl_certificate_key /etc/nginx/ssl/<proxy-host>.key;

    # ---------- 自托管 Umami（默认方案） ----------
    location /umami-api/ {
        # CORS：只允许 GitHub Pages 站点访问
        add_header Access-Control-Allow-Origin  "https://<PAGES_DOMAIN>" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, x-umami-api-key" always;
        add_header Access-Control-Max-Age       86400 always;
        add_header Vary Origin always;

        # 预检请求直接返回 204
        if ($request_method = OPTIONS) {
            return 204;
        }

        # 末尾的 "/" 会把 /umami-api/ 前缀替换掉
        # 前端请求 /umami-api/api/websites/xxx/active -> 上游 /api/websites/xxx/active
        proxy_pass http://127.0.0.1:3000/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Umami Cloud（二选一，启用时注释掉上面的 location） ----------
    # location /umami-api/ {
    #     add_header Access-Control-Allow-Origin  "https://<PAGES_DOMAIN>" always;
    #     add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    #     add_header Access-Control-Allow-Headers "Content-Type, x-umami-api-key" always;
    #     add_header Access-Control-Max-Age       86400 always;
    #
    #     if ($request_method = OPTIONS) {
    #         return 204;
    #     }
    #
    #     # 由服务端注入 API Key，前端无需配置 VUE_APP_UMAMI_API_KEY
    #     proxy_set_header x-umami-api-key "<UMAMI_API_KEY>";
    #     proxy_set_header Host             api.umami.is;
    #     proxy_set_header Origin           "";
    #
    #     proxy_ssl_server_name on;
    #     proxy_pass https://api.umami.is/v1/;
    # }
}
